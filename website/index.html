<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FastCrowdVision — Détection et suivi de personnes</title>
  <link rel="stylesheet" href="style.css" />

  <!-- REMOVED: TensorFlow.js and COCO-SSD script tags.
       Detection now runs on the Python backend (SSDLite + norfair tracker)
       and results arrive via WebSocket. -->
</head>
<body>
  <div class="page">
    <h1>FastCrowdVision — Détection et suivi de personnes</h1>
    <p class="subtitle">
      Téléverse une vidéo, le serveur détecte et suit les personnes image par image.
    </p>

    <div class="controls">
      <!-- CHANGED: upload now POSTs to the server instead of just loading locally -->
      <label class="upload-label" for="videoUpload">Choisir une vidéo</label>
      <input type="file" id="videoUpload" accept="video/*" />

      <!-- REMOVED: play/pause button — server controls video pace (Option A) -->
      <button id="startDetectionBtn" disabled>Démarrer la détection</button>
      <button id="stopDetectionBtn" disabled>Arrêter la détection</button>
    </div>

    <div class="sliders">
      <div class="slider-group">
        <label for="scoreThreshold">
          Seuil de confiance :
          <span id="scoreThresholdValue">0.25</span>
        </label>
        <input
          type="range"
          id="scoreThreshold"
          min="0.05"
          max="0.95"
          step="0.05"
          value="0.25"
        />
      </div>

      <!-- CHANGED: replaced detection interval slider with frame skip slider.
           Server processes every Nth frame — higher skip = faster but less accurate -->
      <div class="slider-group">
        <label for="frameSkipRange">
          Saut d'images (frame skip) :
          <span id="frameSkipValue">0</span>
        </label>
        <input
          type="range"
          id="frameSkipRange"
          min="0"
          max="5"
          step="1"
          value="0"
        />
      </div>
    </div>

    <div class="status-panel">
      <p><strong>Statut serveur :</strong> <span id="serverStatus">En attente</span></p>
      <p><strong>Statut détection :</strong> <span id="detectionStatus">Inactive</span></p>
      <!-- ADDED: separate current count and total unique count -->
      <p><strong>Personnes visibles :</strong> <span id="currentCount">0</span></p>
      <p><strong>Total personnes uniques :</strong> <span id="totalUnique">0</span></p>
      <!-- ADDED: progress indicator -->
      <p><strong>Progression :</strong> <span id="progressInfo">—</span></p>
    </div>

    <div class="video-wrapper" id="videoWrapper">
      <video id="video"></video>
      <canvas id="overlay"></canvas>
    </div>

    <!-- REMOVED: hidden canvas — no longer needed, server reads frames via OpenCV -->
  </div>

  <script src="app.js"></script>
</body>
</html>

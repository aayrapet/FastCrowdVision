<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Détection de personnes sur vidéo</title>
  <link rel="stylesheet" href="style.css" />

  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>

  <!-- COCO-SSD -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
</head>
<body>
  <div class="page">
    <h1>Détection de personnes sur vidéo</h1>
    <p class="subtitle">
      Téléverse une vidéo et lance la détection des personnes pendant la lecture.
    </p>

    <div class="controls">
      <label class="upload-label" for="videoUpload">Choisir une vidéo</label>
      <input type="file" id="videoUpload" accept="video/*" />

      <button id="playPauseBtn" disabled>Lecture</button>
      <button id="startDetectionBtn" disabled>Démarrer la détection</button>
      <button id="stopDetectionBtn" disabled>Arrêter la détection</button>
    </div>

    <div class="sliders">
      <div class="slider-group">
        <label for="scoreThreshold">
          Seuil de confiance :
          <span id="scoreThresholdValue">0.50</span>
        </label>
        <input
          type="range"
          id="scoreThreshold"
          min="0.1"
          max="0.95"
          step="0.05"
          value="0.5"
        />
      </div>

      <div class="slider-group">
        <label for="intervalRange">
          Intervalle de détection (ms) :
          <span id="intervalValue">300</span>
        </label>
        <input
          type="range"
          id="intervalRange"
          min="100"
          max="1000"
          step="50"
          value="300"
        />
      </div>
    </div>

    <div class="status-panel">
      <p><strong>Statut modèle :</strong> <span id="modelStatus">Chargement...</span></p>
      <p><strong>Statut détection :</strong> <span id="detectionStatus">Inactive</span></p>
      <p><strong>Nombre de personnes :</strong> <span id="personCount">0</span></p>
    </div>

    <div class="video-wrapper" id="videoWrapper">
      <video id="video" controls></video>
      <canvas id="overlay"></canvas>
    </div>

    <!-- Canvas caché pour capturer les frames -->
    <canvas id="hiddenCanvas" class="hidden-canvas"></canvas>
  </div>

  <script src="app.js"></script>
</body>
</html>

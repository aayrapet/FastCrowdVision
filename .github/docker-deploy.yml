# ──────────────────────────────────────────────────────────────────────────────
# .github/workflows/docker-deploy.yml
# Pipeline CI/CD : build → push image → deploy sur SSP Cloud
#
# Secrets GitHub à configurer (Settings → Secrets and variables → Actions) :
#   REGISTRY_URL      : ex. harbor.lab.sspcloud.fr
#   REGISTRY_USER     : votre identifiant Harbor
#   REGISTRY_PASSWORD : votre mot de passe / token Harbor
# ──────────────────────────────────────────────────────────────────────────────
name: Build & Deploy FastCrowdVision

on:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  IMAGE_NAME: fastcrowdvision

jobs:
  # ── 1. Tests rapides ─────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest torch torchvision --quiet

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  # ── 2. Build & Push image Docker ─────────────────────────────────────────
  build-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Log in to Harbor registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:cache
          cache-to:   type=registry,ref=${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:cache,mode=max

  # ── 3. Déploiement sur SSP Cloud (kubectl apply) ─────────────────────────
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    # Ne déployer que depuis main ou un tag de release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag in deployment manifest
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${{ secrets.REGISTRY_URL }}/fastcrowdvision:sha-${SHORT_SHA}"
          sed -i "s|<REGISTRY>/fastcrowdvision:<TAG>|${IMAGE}|g" kubernetes/deployment.yaml

      - name: Configure kubectl (kubeconfig SSP Cloud)
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_SSP }}" | base64 -d > $HOME/.kube/config

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f kubernetes/pvc.yaml
          kubectl apply -f kubernetes/deployment.yaml
          kubectl apply -f kubernetes/service.yaml
          kubectl apply -f kubernetes/ingress.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/fastcrowdvision --timeout=180s

# ─────────────────────────────────────────────────────────────────
# .github/workflows/docker-deploy.yml
# Pipeline CI/CD — conforme au cours ENSAE "Mise en production"
#
# Reproduit exactement le schéma du cours :
#   push sur main → build image Docker → push sur Docker Hub
#
# Secrets GitHub à configurer :
#   DOCKERHUB_USERNAME : votre identifiant Docker Hub
#   DOCKERHUB_TOKEN    : Access Token Docker Hub
#                        (hub.docker.com → Account Settings → Security)
#   KUBECONFIG_SSP     : kubeconfig SSP Cloud encodé en base64
# ─────────────────────────────────────────────────────────────────
name: Build & Deploy FastCrowdVision

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/fastcrowdvision
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set image in deployment manifest
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/fastcrowdvision:sha-${SHORT_SHA}"
          sed -i "s|<DOCKERHUB_USER>/fastcrowdvision:<TAG>|${IMAGE}|g" \
            kubernetes/deployment.yaml

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_SSP }}" | base64 -d > $HOME/.kube/config

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f kubernetes/pvc.yaml
          kubectl apply -f kubernetes/deployment.yaml
          kubectl apply -f kubernetes/service.yaml
          kubectl apply -f kubernetes/ingress.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/fastcrowdvision --timeout=180s

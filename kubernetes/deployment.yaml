# ─────────────────────────────────────────────────────────────────
# kubernetes/deployment.yaml
# ⚠️  Remplacer <DOCKERHUB_USER> par votre compte Docker Hub
#     Remplacer <TAG>             par le tag voulu (ex: latest)
# ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastcrowdvision
  labels:
    app: fastcrowdvision
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastcrowdvision
  template:
    metadata:
      labels:
        app: fastcrowdvision
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000

      containers:
        - name: fastcrowdvision
          image: <DOCKERHUB_USER>/fastcrowdvision:<TAG>
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http

          env:
            - name: HF_HOME
              value: /app/.cache/huggingface

          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          # Attend que le modèle soit chargé (jusqu'à 3 min)
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 18
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          volumeMounts:
            - name: hf-cache
              mountPath: /app/.cache/huggingface
            - name: tmp-dir
              mountPath: /tmp

      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: fastcrowdvision-hf-cache
        - name: tmp-dir
          emptyDir:
            sizeLimit: 2Gi

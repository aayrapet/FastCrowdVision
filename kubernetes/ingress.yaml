# ──────────────────────────────────────────────────────────────────────────────
# kubernetes/ingress.yaml
# Expose l'API publiquement via l'Ingress du SSP Cloud
#
# Remplacer user-pmakamwe-ensae par votre namespace Onyxia (ex: user-votreuser)
# L'URL finale sera : https://fastcrowdvision.user-pmakamwe-ensae.lab.sspcloud.fr
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastcrowdvision
  annotations:
    # TLS géré automatiquement par cert-manager (déjà configuré sur SSP Cloud)
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Taille max de l'upload (vidéos pouvant être volumineuses)
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    # Timeout élevé pour le WebSocket de détection long
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Activation du support WebSocket
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  tls:
    - hosts:
        - fastcrowdvision.user-pmakamwe-ensae.lab.sspcloud.fr
      secretName: fastcrowdvision-tls
  rules:
    - host: fastcrowdvision.user-pmakamwe-ensae.lab.sspcloud.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fastcrowdvision
                port:
                  name: http

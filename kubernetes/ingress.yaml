# ──────────────────────────────────────────────────────────────────────────────
# kubernetes/ingress.yaml
# Expose l'API publiquement via l'Ingress du SSP Cloud (Traefik + cert-manager)
#    URL finale sera :
#       https://fastcrowdvision.lab.sspcloud.fr
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastcrowdvision
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/websocket-services: "fastcrowdvision"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - fastcrowdvision.lab.sspcloud.fr
  rules:
    - host: fastcrowdvision.lab.sspcloud.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fastcrowdvision
                port:
                  number: 80
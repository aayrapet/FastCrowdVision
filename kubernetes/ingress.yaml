# ──────────────────────────────────────────────────────────────────────────────
# kubernetes/ingress.yaml
# Expose l'API publiquement via l'Ingress du SSP Cloud (Traefik + cert-manager)
#
# ⚠️  Remplacer <IDEP> par votre identifiant Onyxia.
#     Votre namespace est toujours de la forme :  user-<IDEP>
#     Votre URL finale sera :
#       https://fastcrowdvision.user-<IDEP>.lab.sspcloud.fr
#
# Comment trouver votre <IDEP> :
#   datalab.sspcloud.fr → Mon compte → le namespace affiché dans la section
#   Kubernetes, ou visible dans le kubeconfig téléchargé.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastcrowdvision
  annotations:
    # SSP Cloud utilise Traefik comme ingress controller (pas nginx)
    kubernetes.io/ingress.class: traefik
    # TLS Let's Encrypt géré par cert-manager (déjà installé sur le cluster)
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Support WebSocket (nécessaire pour /ws/detect)
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - fastcrowdvision.user-<IDEP>.lab.sspcloud.fr
      secretName: fastcrowdvision-tls
  rules:
    - host: fastcrowdvision.user-<IDEP>.lab.sspcloud.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fastcrowdvision
                port:
                  name: http

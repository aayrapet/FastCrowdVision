# ──────────────────────────────────────────────────────────────────────────────
# kubernetes/ingress.yaml
# Expose l'API publiquement via l'Ingress du SSP Cloud (Traefik + cert-manager)
#    URL finale sera :
#       https://fastcrowdvision.user-pmakamwe.lab.sspcloud.fr
#
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastcrowdvision
  annotations:
    # SSP Cloud utilise Traefik comme ingress controller (pas nginx)
    kubernetes.io/ingress.class: traefik
    # TLS Let's Encrypt géré par cert-manager (déjà installé sur le cluster)
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Support WebSocket (nécessaire pour /ws/detect)
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - fastcrowdvision.user-pmakamwe.lab.sspcloud.fr
      secretName: fastcrowdvision-tls
  rules:
    - host: fastcrowdvision.user-pmakamwe.lab.sspcloud.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fastcrowdvision
                port:
                  name: http
